<form [formGroup]="formGroup" *ngIf="config" class="form-container">
    <div class="info-icon-container" *ngIf="config.infoTooltip" [title]="config.infoTooltip">
        <i class="ti ti-info-circle"></i>
    </div>
    <div *ngFor="let section of config.formSectionConfig" class="form-section">
        <h3 *ngIf="section.sectionLabel" class="section-title text-uppercase font-weight-bold">
            {{ section.sectionLabel }}
        </h3>

        <div class="form-grid" [ngClass]="'layout-' + (section.sectionLayout || 1)">
            <div *ngFor="let field of section.formFieldConfig" class="field-item"
                [ngClass]="'span-' + (field.colspan || 1)" [class.hidden]="field.hideOnLoad">

                <app-dynamic-form [config]="field" [formGroup]="formGroup" (fieldClick)="fieldClick.emit($event)">
                </app-dynamic-form>
            </div>
        </div>
    </div>
</form>
