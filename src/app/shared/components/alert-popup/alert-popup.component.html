<div class="alert-dialog">
  <!-- Close Button -->
  @if (data?.icon) {
  <button class="alert-close-btn" (click)="closeAlert()" aria-label="Close">
    <mat-icon [fontIcon]="data.icon"></mat-icon>
  </button>
  }

  <!-- Illustration -->
  @if (data?.image) {
  <div class="alert-illustration">
    <img [src]="data.image" alt="Alert" />
  </div>
  }

  <!-- Heading -->
  @if (data?.heading) {
  <h2 class="alert-heading">{{ data.heading }}</h2>
  }

  <!-- Content (supports HTML) -->
  @if (data?.content) {
  <p class="alert-content" [innerHTML]="data.content"></p>
  }

  <!-- Action Buttons — Standard -->
  @if (!data?.popupType || data?.popupType !== 'FORM-SUBMIT') {
  <div class="alert-actions">
    @for (label of $any(data?.buttons); track label; let i = $index) {
    <button class="btn alert-btn" [class.alert-btn-primary]="i === 0" [class.alert-btn-secondary]="i !== 0"
      (click)="onButtonClick(label)">
      @if (i === 0) {
      <i class="ti ti-check me-1"></i>
      }
      {{ label }}
    </button>
    }
  </div>
  }

  <!-- Action Button — Form Submit -->
  @if (data?.popupType === 'FORM-SUBMIT') {
  <div class="alert-actions-single">
    <button class="btn alert-btn" [class.alert-btn-success]="data?.alertType === 'SUCCESS'"
      [class.alert-btn-primary]="data?.alertType !== 'SUCCESS'" (click)="onButtonClick(data?.buttons)">
      @if (data?.alertType === 'SUCCESS') {
      <i class="ti ti-circle-check me-1"></i>
      }
      {{ data?.buttons }}
    </button>
  </div>
  }
</div>
