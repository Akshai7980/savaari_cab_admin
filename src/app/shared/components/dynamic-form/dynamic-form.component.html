<div [formGroup]="formGroup" class="form-field-container mb-3">
    <label [for]="config.fieldID" class="form-label font-weight-bold" *ngIf="config.fieldLabel">
        {{ config.fieldLabel }}
        <span *ngIf="config.mandatory" class="text-danger">*</span>
    </label>

    <ng-container [ngSwitch]="config.controlType">
        <div class="input-group-container" [class.large-prefix]="config.prefixText && config.prefixText.length > 3">
            <div class="prefix-container" *ngIf="config.prefixIcon || config.prefixText">
                <span class="flag-icon" *ngIf="config.prefixIcon">{{ config.prefixIcon }}</span>
                <div class="vertical-divider" *ngIf="config.prefixIcon && config.prefixText"></div>
                <span *ngIf="config.prefixText">{{ config.prefixText }}</span>
            </div>
            <input *ngSwitchCase="'TextBox'" [type]="config.type || 'text'" [id]="config.fieldID"
                [formControlName]="config.fieldID" class="form-control" [placeholder]="config.placeholder || ''"
                (blur)="onBlur()" (input)="onInput($event)" [class.has-prefix]="config.prefixIcon || config.prefixText">
        </div>

        <div class="field-hint text-muted small mt-1" *ngIf="config.hint && !getError()">
            <i class="ti ti-info-circle me-1"></i> {{ config.hint }}
        </div>

        <!-- Dropdown -->
        <select *ngSwitchCase="'Dropdown'" [id]="config.fieldID" [formControlName]="config.fieldID"
            class="form-select shadow-sm" [class.placeholder-active]="!control?.value">
            <option value="" disabled selected>{{ config.placeholder || 'Select ' + config.fieldLabel }}</option>
            <option *ngFor="let opt of config.options" [value]="opt.value">{{ opt.label }}</option>
        </select>

        <!-- Radio -->
        <div *ngSwitchCase="'Radio'" class="radio-group mt-2">
            <div class="form-check form-check-inline" *ngFor="let opt of config.options; let i = index">
                <input class="form-check-input" type="radio" [id]="config.fieldID + '_' + i" [value]="opt.value"
                    [formControlName]="config.fieldID">
                <label class="form-check-label" [for]="config.fieldID + '_' + i">{{ opt.label }}</label>
            </div>
        </div>

        <!-- Checkbox -->
        <div *ngSwitchCase="'Checkbox'" class="form-check">
            <input class="form-check-input" type="checkbox" [id]="config.fieldID" [formControlName]="config.fieldID">
            <label class="form-check-label" [for]="config.fieldID">{{ config.fieldLabel }}</label>
        </div>

        <!-- TextArea -->
        <div class="textarea-container">
            <textarea *ngSwitchCase="'TextArea'" [id]="config.fieldID" [formControlName]="config.fieldID"
                class="form-control" [placeholder]="config.placeholder || ''" rows="3" (input)="onInput($event)"
                [attr.maxlength]="config.maxLength || null"></textarea>
            <div class="char-counter text-muted small text-end mt-1" *ngIf="config.showCounter">
                {{ (control?.value?.length || 0) }} / {{ config.maxLength || 100 }}
            </div>
        </div>

        <!-- Date -->
        <input *ngSwitchCase="'Date'" type="date" [id]="config.fieldID" [formControlName]="config.fieldID"
            class="form-control shadow-sm" [placeholder]="config.placeholder || ''"
            [class.placeholder-active]="!control?.value" [attr.min]="minDate" [attr.max]="maxDate">

        <!-- Number -->
        <input *ngSwitchCase="'Number'" type="tel" [id]="config.fieldID" [formControlName]="config.fieldID"
            class="form-control" (keypress)="onNumberKeyPress($event)" [placeholder]="config.placeholder || ''">
    </ng-container>

    <div class="invalid-feedback d-block text-danger small mt-1" *ngIf="getError()">
        {{ getError() }}
    </div>
</div>
