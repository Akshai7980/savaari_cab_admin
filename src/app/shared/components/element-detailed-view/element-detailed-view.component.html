<div class="detail-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <div class="header-content">
      <div class="header-icon-badge">
        <i class="ti ti-file-text"></i>
      </div>
      <h2 class="dialog-title">{{ data.heading }}</h2>
    </div>
    <button class="close-btn" (click)="close()" aria-label="Close dialog">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>

  <!-- Details List -->
  <div class="dialog-body">
    @if (details.length > 0) {
    <div class="details-grid">
      @for (item of details; track item.key; let i = $index) {
      <div class="detail-row" [style.animation-delay]="(i * 40) + 'ms'">
        <span class="detail-key">{{ item.key }}</span>
        <span class="detail-value">{{ item.value || '--' }}</span>
      </div>
      }
    </div>
    }
  </div>

  <!-- Footer Actions -->
  <div class="dialog-footer">
    <button class="btn btn-detail-edit" (click)="edit()">
      <i class="ti ti-pencil me-1"></i>
      {{ data.buttons1 || 'Edit' }}
    </button>
    <button class="btn btn-detail-danger" (click)="delete()">
      <i class="ti ti-trash me-1"></i>
      {{ data.buttons2 || 'Delete' }}
    </button>
  </div>
</div>
