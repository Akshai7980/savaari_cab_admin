<div class="main-content-wrapper">
  <!-- Breadcrumb section is handled by the parent layout -->

  <div class="main-container-violet p-4" *ngIf="!isLoading()">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="main-title mb-0">Add Driver Details (Registration)</h1>
    </div>

    <!-- Form Area -->
    <div class="form-card-container" *ngIf="!isLoading()">
      <app-dynamic-form-container [config]="formConfig" [formGroup]="driverRegForm">
      </app-dynamic-form-container>

      <!-- Action Buttons -->
      <div class="footer-actions mt-4 text-end">
        <button type="button" class="btn btn-cancel-booking px-5 py-2" (click)="onCancel()">
          Cancel Registration
        </button>

        <button type="button" class="btn btn-schedule-booking px-5 py-2 shadow" (click)="onSubmit()"
          [disabled]="driverRegForm.invalid">
          Register Driver
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <app-form-loader [isLoading]="isLoading()"></app-form-loader>
</div>
